const paid=t=>t.y.reduce((a,b)=>a+b.a,0),sisa=t=>t.total-paid(t);

function go(t){tab=t;render()}
function render(){
 $('#nav').innerHTML=[['kasir','Kasir'],['riwayat','Riwayat'],['uang','Keuangan'],['stok','Stok'],['produk','Produk']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${({kasir:'🧾',riwayat:'📜',uang:'💰',stok:'📦',produk:'🏷️'})[x[0]]}</i>${x[1]}</button>`).join('');
 $('#app').innerHTML=({kasir:vKasir,riwayat:vRiwayat,uang:vUang,stok:vStok,produk:vProduk})[tab]();
 if(tab=='kasir')hitung();
}
function vKasir(){return `<div class="grid g2"><div>
<div class="card"><h2>Pilih Produk</h2><input id='sc' placeholder='Scan barcode / ketik kode, lalu Enter' onkeydown='scanKey(event,this)' style='margin-bottom:10px'><div class="prods">${S.p.map(p=>`<button class="prod" onclick="add('${p.id}')"><b>${esc(p.n)}</b><span>${rp(p.h)}</span></button>`).join('')}</div></div>

function add(id){const p=S.p.find(x=>x.id==id),c=cart.find(x=>x.pid==id&&x.h==p.h);c?c.q++:cart.push({pid:id,n:p.n,h:p.h,q:1});drawCart()}

function drawCart(){const c=$('#cart');if(!c)return;c.innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><div><b>${esc(x.n)}</b></div><input type="number" min="1" value="${x.q}" oninput="cart[${i}].q=+this.value||1;hitung()"><input type="number" value="${x.h}" oninput="cart[${i}].h=+this.value||0;hitung()"><button class="btn s r" onclick="cart.splice(${i},1);drawCart()">×</button></div>`).join(''):'<div class="empty">Belum ada item</div>';hitung()}

 $('#st').textContent=rp(st);$('#tt').textContent=rp(tt);const k=b-tt;$('#kl').textContent=k>=0?'Kembalian':'Sisa (piutang)';$('#kv').textContent=rp(Math.abs(k));$('#kv').className=k>=0?'ok':'bad'}

 S.t.unshift({id:uid(),d:today(),cu:$('#cu').value.trim(),wa:$('#wa').value.trim(),sh:$('#sh').value,ad:$('#ad').value.trim(),og:+$('#og').value||0,st:'Baru',it:cart.map(c=>({n:c.n,h:c.h,q:c.q})),ds,total:tt,m:$('#me').value,y:b>0?[{d:today(),a:b}]:[]});

<h2 style='margin-top:16px'>Pembayaran</h2>${ED.y.map((p,k)=>`<div class='row' style='margin-bottom:6px'><input type='date' value='${p.d}' oninput='ED.y[${k}].d=this.value||ED.y[${k}].d'><input type='number' value='${p.a}' oninput='ED.y[${k}].a=+this.value||0;edTot()'><button class='btn s r' onclick='ED.y.splice(${k},1);drawEd()'>×</button></div>`).join('')}<button class='btn s g' onclick='edAddP()'>+ Tambah pembayaran</button><div id='edt' style='margin-top:12px'></div><div id='edm' class='bad' style='margin-top:6px'></div><div style='display:grid;gap:8px;margin-top:12px'><button class='btn' onclick='edSave()'>Simpan perubahan</button><button class='btn g' onclick='tutup()'>Batal</button></div></div>`;edTot()}
function edAddI(){ED.it.push({n:'Item baru',h:0,q:1});drawEd()}
function edAddP(){ED.y.push({d:today(),a:0});drawEd()}
function edTot(){const sub=ED.it.reduce((a,i)=>a+i.q*i.h,0),tt=Math.max(0,sub-(ED.ds||0))+(ED.og||0),pd=ED.y.reduce((a,b)=>a+b.a,0),m=$('#edt');ED.total=tt;if(m)m.innerHTML=`<div class='tot'><span>Subtotal</span><b>${rp(sub)}</b></div><div class='tot big'><span>Total</span><span>${rp(tt)}</span></div><div class='tot'><span>Dibayar</span><b>${rp(pd)}</b></div><div class='tot'><span>${tt>=pd?'Sisa':'Kelebihan bayar'}</span><b class='${tt>pd?'bad':'ok'}'>${rp(Math.abs(tt-pd))}</b></div>`}
function edSave(){if(!ED.it.length){$('#edm').textContent='Minimal ada satu item.';return}ED.cu=(ED.cu||'').trim();ED.y=ED.y.filter(p=>p.a>0);edTot();const i=S.t.findIndex(x=>x.id==ED.id);if(i<0)return;S.t[i]=ED;ED=null;save();tutup();render()}
function unduhInv(){const t=S.t.find(x=>x.id==LR[1]);simpanFile('invoice-'+t.no+'.html',`<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Invoice ${t.no}</title></head><body style='margin:0;padding:16px;background:#f3f3f3'>${invHTML(t)}</body></html>`)}
function struk(t){const L=['TERIMA KASIH ATAS PESANAN ANDA','',...t.it.map(i=>'- '+i.n+' × '+i.q+' ('+rp(i.q*i.h)+')'),...(t.og?['Ongkir: '+rp(t.og)]:[]),...(t.ds?['Diskon: '+rp(t.ds)]:[]),'*Total: '+rp(t.total)+'*',sisa(t)>0?'Sisa pembayaran: '+rp(sisa(t)):'Status: LUNAS','','😊','Untuk informasi pesanan sudah selesai atau belum, silakan tanyakan melalui WhatsApp ini.','Terima kasih telah mempercayakan kebutuhan cetak Anda kepada kami!'];return 'https://wa.me/'+wnum(t.wa)+'?text='+encodeURIComponent(L.join(String.fromCharCode(10)))}
function sukses(t){$('#rc').innerHTML=`<div class='rcb' style='font-family:inherit;text-align:center'><b>Nota tersimpan ✅</b><br><span>${esc(t.cu||'Pelanggan umum')} · ${rp(t.total)}</span></div><div class='noprint' style='max-width:300px;margin:12px auto;display:grid;gap:8px'><a class='btn' target='_blank' rel='noopener' href='${struk(t)}' onclick='tutup()'>Kirim nota ke WhatsApp${t.wa?'':' (pilih kontak)'}</a><button class='btn g' onclick='invoice("${t.id}")'>Buat invoice</button><button class='btn g' onclick='cetak("${t.id}")'>Cetak nota</button><button class='btn g' onclick='tutup()'>Tutup</button></div>`;$('#rc').classList.remove('hide')}function tema(){const h=document.documentElement;h.dataset.d=h.dataset.d=='min'?'glass':'min';try{localStorage.setItem('po_tema',h.dataset.d)}catch(e){}}
const BAR=`<div class='noprint' style='max-width:300px;margin:12px auto;display:grid;gap:8px'><button class='btn' onclick='prBT()'>🖨️ Cetak via Bluetooth</button><div class='row'><button class='btn g' onclick='prUSB()'>USB</button><a class='btn g' onclick='prRaw(this)' target='_blank' rel='noopener'>RawBT</a></div><div class='row'><button class='btn g' onclick='cetakan()'>Print browser</button><button class='btn g' onclick='tutup()'>Tutup</button></div><div id='pm' class='k' style='text-align:center'></div></div>`;
function msg(s){const m=$('#pm');if(m)m.textContent=s}
function wrap(s){return String(s).match(/.{1,32}/g)||['']}
function rcLines(t){const W=32,pd=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b,ct=s=>' '.repeat(Math.max(0,(W-s.length)>>1))+s,hr='-'.repeat(W),L=[ct('PERCETAKAN ONLINE INDONESIA'),ct('Jembangan, Pabelan, Kartasura'),ct('WA 0896 7123 2204'),hr,...wrap(t.d+(t.cu?' '+t.cu:'')),hr];t.it.forEach(i=>{L.push(...wrap(i.n));L.push(pd(i.q+' x '+rp(i.h),rp(i.q*i.h)))});L.push(hr);if(t.og)L.push(pd('Ongkir',rp(t.og)));if(t.ds)L.push(pd('Diskon','-'+rp(t.ds)));L.push(pd('TOTAL',rp(t.total)),pd('Bayar ('+t.m+')',rp(paid(t))),sisa(t)>0?pd('SISA',rp(sisa(t))):ct('** LUNAS **'),hr,ct('Terima kasih'));return L}
function lblLines(t){const hr='-'.repeat(32),L=['INVOICE PENGIRIMAN',hr,'Pengirim:','Percetakan Online Indonesia','Jembangan, Pabelan, Kartasura','WA 0896 7123 2204',hr,'Penerima:',...wrap(t.cu||'-'),...wrap(t.wa||''),...wrap(t.ad||'-'),hr,'Kurir: '+t.sh,'Ongkir: '+rp(t.og||0),'Tgl: '+t.d,hr,'Isi paket:'];t.it.forEach(i=>L.push(...wrap(i.n+' x'+i.q)));L.push(hr,sisa(t)>0?'COD / sisa bayar: '+rp(sisa(t)):'LUNAS');return L}
function escBytes(){if(!LR)return null;const t=S.t.find(x=>x.id==LR[1]);if(!t)return null;const tx=(LR[0]=='l'?lblLines(t):rcLines(t)).join(String.fromCharCode(10))+String.fromCharCode(10,10,10,10),b=new TextEncoder().encode(tx.replace(/[^\x0A\x20-\x7E]/g,'?')),o=new Uint8Array(b.length+2);o.set([27,64]);o.set(b,2);return o}
async function prBT(){msg('');try{if(!navigator.bluetooth)return msg('Browser ini belum mendukung Bluetooth. Pakai Chrome atau Edge, atau tombol RawBT.');const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});const g=await d.gatt.connect(),sv=await g.getPrimaryServices();let ch=null;for(const s of sv){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}}if(ch)break}if(!ch)return msg('Printer ini tidak terbaca. Coba tombol RawBT.');const b=escBytes();for(let i=0;i<b.length;i+=100){const p=b.slice(i,i+100);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p)}msg('Terkirim ke printer.')}catch(e){msg('Gagal: '+(e&&e.message||e))}}
async function prUSB(){msg('');try{if(!navigator.usb)return msg('Browser ini belum mendukung USB. Pakai Chrome atau Edge di komputer.');const d=await navigator.usb.requestDevice({filters:[]});await d.open();if(!d.configuration)await d.selectConfiguration(1);let ep=null,ifn=null;for(const i of d.configuration.interfaces)for(const a of i.alternates)for(const e of a.endpoints)if(e.direction=='out'&&(ep==null||a.interfaceClass==7)){ep=e.endpointNumber;ifn=i.interfaceNumber}if(ep==null)return msg('Jalur cetak USB tidak ditemukan.');await d.claimInterface(ifn);await d.transferOut(ep,escBytes());await d.close();msg('Terkirim ke printer.')}catch(e){msg('Gagal: '+(e&&e.message||e))}}
function prRaw(a){const b=escBytes();if(!b)return;a.href='rawbt:base64,'+btoa(String.fromCharCode.apply(null,b));msg('Membuka RawBT. Aplikasi RawBT harus terpasang di Android.')}
function tutup(){$('#rc').classList.add('hide')}
function scanKey(e,el){if(e.key!=='Enter')return;const k=el.value.trim().toLowerCase();if(!k)return;const p=S.p.find(x=>(x.k||'').toLowerCase()==k);el.value='';if(p)add(p.id);else alert('Kode tidak ditemukan')}
function addOn(i){const a=S.a[i];cart.push({n:'+ '+a.n,h:a.h,q:1});drawCart()}
function addA(){const n=$('#an').value.trim(),h=+$('#ah').value;if(!n||!h)return;S.a.push({id:uid(),n,h});save();render()}
function shipUI(){$('#al').classList.toggle('hide',$('#sh').selectedIndex==0)}
function tot(){return Math.max(0,cartSub()-(+$('#ds').value||0))+(+$('#og').value||0)}
function qp(n){$('#by').value=n||tot();hitung()}
function setSt(id,v){S.t.find(x=>x.id==id).st=v;save()}
function wnum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);return p}
function notif(t){return 'https://wa.me/'+wnum(t.wa)+'?text='+encodeURIComponent('Halo '+(t.cu||'Kak')+', pesanan Anda di Percetakan Online Indonesia berstatus: '+(t.st||'Baru')+'. Total '+rp(t.total)+(sisa(t)>0?', sisa pembayaran '+rp(sisa(t)):'')+'. Terima kasih.')}
function label(id){LR=['l',id];const t=S.t.find(x=>x.id==id);$('#rc').innerHTML=`<div class='rcb'><b>INVOICE PENGIRIMAN</b><hr><b>Pengirim</b><br>Percetakan Online Indonesia<br>Jembangan, Pabelan, Kartasura<br>WA 0896 7123 2204<hr><b>Penerima</b><br>${esc(t.cu||'-')}<br>${esc(t.wa||'')}<br>${esc(t.ad||'-')}<hr>Kurir: ${esc(t.sh)}<br>Ongkir: ${rp(t.og)}<br>Tgl: ${t.d}<hr><b>Isi paket</b><br>${t.it.map(i=>esc(i.n)+' ×'+i.q).join('<br>')}<hr>${sisa(t)>0?`<b>COD / sisa bayar: ${rp(sisa(t))}</b>`:'<b>LUNAS</b>'}</div>${BAR}`;$('#rc').classList.remove('hide')}
function vStok(){const low=S.s.filter(x=>x.q<=x.m);return `<div class='grid g2'><div class='card'><h2>Stok Bahan</h2>${low.length?`<p class='bad'><b>Stok menipis:</b> ${low.map(x=>esc(x.n)).join(', ')}</p>`:''}${S.s.length?S.s.map((x,i)=>`<div class='item'><div class='row'><b>${esc(x.n)}</b><span class='s tag ${x.q<=x.m?'b':'l'}'>${x.q<=x.m?'Menipis':'Aman'}</span></div><div class='row' style='margin-top:6px'><button class='btn s g' onclick='stk(${i},-1)'>−</button><input type='number' value='${x.q}' onchange='S.s[${i}].q=+this.value||0;save();render()'><span class='s k'>${esc(x.u)} · min ${x.m}</span><button class='btn s g' onclick='stk(${i},1)'>+</button><button class='btn s r' onclick='S.s.splice(${i},1);save();render()'>×</button></div></div>`).join(''):`<div class='empty'>Belum ada stok</div>`}</div><div class='card'><h2>Tambah Bahan</h2><label>Nama</label><input id='sn' placeholder='mis. Kertas HVS A4'><div class='row'><div><label>Jumlah</label><input id='sq' type='number'></div><div><label>Satuan</label><input id='su' placeholder='rim / pcs / m'></div><div><label>Batas minimum</label><input id='sm' type='number'></div></div><div style='margin-top:10px'><button class='btn' onclick='addS()'>Simpan</button></div></div></div>`}
function stk(i,d){S.s[i].q=Math.max(0,S.s[i].q+d);save();render()}
function addS(){const n=$('#sn').value.trim();if(!n)return;S.s.push({id:uid(),n,q:+$('#sq').value||0,u:$('#su').value.trim()||'pcs',m:+$('#sm').value||0});save();render()}
function impor(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.p&&d.t&&d.e){S=d;S.s=S.s||[];S.a=S.a||[];save();render();alert('Data dipulihkan')}else alert('File tidak valid')}catch(e){alert('File tidak valid')}};r.readAsText(f)}
render();
</script></body></html>
